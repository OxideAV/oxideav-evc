[package]
name = "oxideav-evc"
version = "0.0.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-evc"
authors = ["Mark Karpeles"]
description = "Pure-Rust EVC (MPEG-5 Essential Video Coding, ISO/IEC 23094-1) decoder and encoder. Decode: Baseline + Main profile tools, 8..16-bit 4:2:0, multi-tile, ALF/DRA/HTDF. Encode: intra + P/B GOPs with EIPD, RDOQ, exact-bit RD, one- and two-pass rate control."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-evc"
keywords = ["multimedia", "video", "evc", "mpeg5", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
oxideav-core = "0.1"
